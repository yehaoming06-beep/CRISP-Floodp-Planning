[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crisp-data-layer"
version = "1.0.0"
description = "Reproducible CRITIC and one-dimensional K-means flood scenario data layer for CRISP."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "PyYAML>=6.0,<7",
  "scikit-learn>=1.3,<2",
]

[project.optional-dependencies]
dev = ["pytest>=7.4,<9"]

[project.scripts]
crisp-data-layer = "crisp_data_layer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crisp_data_layer = ["*.mjs"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

